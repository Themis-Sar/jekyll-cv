projects:
  - title: Project ELEGANT – EU-funded
    description: >
      ELEGANT develops innovative software solutions addressing core IoT and Big Data challenges: interoperability, reliability, and cybersecurity. It features lightweight virtualization, AI-assisted orchestration, and dynamic code migration to support seamless IoT/Big Data operations end-to-end.
    link: https://cordis.europa.eu/project/id/957286

  - title: Project AC3 – Agile and Cognitive Cloud-edge Continuum Management (EU-funded)
    description: >
      AC3 leverages AI and Machine Learning to create dynamic profiles of application traffic and context to manage microservice placement across cloud-edge infrastructure. Profiles use Semantic Web and ontologies to support lifecycle actions such as migration and replication in response to resource usage.
    link: https://ac3-project.eu/

  - title: Project 6G-DALI – AI for 6G Networks (EU-funded)
    description: >
      6G-DALI provides an end-to-end reference framework to support AI integration in 6G networks. It delivers on-demand AI testing services, high-quality open datasets, and a digital twin platform for AI data generation tailored to 6G scenarios.
    link: https://6gdali.eu/
    
